<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identica - Fish Identification</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 0 auto; padding: 16px; background: #f4f8fa; color: #12303b; }
  h1 { color: #0b5d7a; margin-bottom: 4px; }
  #status { font-size: 14px; margin: 8px 0 14px; color: #456; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button, .filebtn { background: #0b5d7a; color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .45; }
  input[type=file] { display: none; }
  video, #preview { width: 100%; max-height: 360px; object-fit: contain; border-radius: 10px; background: #000; display: none; margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; font-size: 15px; }
  .row.top .name { font-weight: 700; }
  .bar { grid-column: 1 / -1; height: 8px; background: #dbe7ec; border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; background: #0b5d7a; }
</style>
</head>
<body>
  <h1>Identica</h1>
  <div>Fish identification for Ghana</div>
  <div id="status">Starting...</div>

  <div class="btns">
    <label class="filebtn">Take / Upload photo
      <input type="file" id="fileInput" accept="image/*" capture="environment">
    </label>
    <button id="startCamBtn" type="button">Live camera</button>
    <button id="snapBtn" type="button" disabled>Capture frame</button>
    <button id="stopCamBtn" type="button" disabled>Stop</button>
  </div>

  <video id="video" playsinline muted></video>
  <img id="preview" alt="Fish preview">
  <div id="results"></div>

  <!-- TensorFlow.js only (pinned version) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
